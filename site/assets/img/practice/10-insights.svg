<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 460" role="img" aria-labelledby="title desc"><title id="title">실습 10 설명 도식</title><desc id="desc">실제 앱 화면이 아닙니다. 휴대폰 틀 안의 1 같은 게시물 찾기, 2 기간·단위 기록, 3 미제공 값 구분을 순서대로 강조합니다. 버튼 위치는 설명용입니다.</desc><rect width="360" height="460" rx="20" fill="#eaf0e5"/><rect x="52" y="20" width="256" height="394" rx="30" fill="#fffefa" stroke="#30624f" stroke-width="3"/><rect x="137" y="30" width="86" height="7" rx="3" fill="#dcded4"/><g font-family="system-ui,sans-serif" fill="#202d29"><text x="72" y="78" font-size="19" font-weight="700">기간·범위</text><rect x="72" y="102" width="216" height="53" rx="10" fill="#eaf0e5" stroke="#30624f" stroke-width="2"/><text x="86" y="135" font-size="16">1  같은 게시물 찾기</text><rect x="72" y="180" width="216" height="110" rx="10" fill="#f3e8d6"/><text x="86" y="222" font-size="16">2  기간·단위 기록</text><path d="M88 246h168m-168 20h125" stroke="#626d66" stroke-width="3"/><rect x="72" y="320" width="216" height="55" rx="10" fill="#30624f"/><text x="86" y="354" font-size="16" fill="#fffefa">3  미제공 값 구분</text><text x="52" y="442" font-size="12">설명용 위치 · 화면이 다를 수 있음 · 2026-10-26</text></g></svg>
