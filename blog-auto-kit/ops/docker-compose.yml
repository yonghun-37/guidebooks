services:
  db:
    image: mariadb:11.4.13-noble
    mem_limit: 256m
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    volumes:
      - db:/var/lib/mysql
  wordpress:
    image: wordpress:7.1.3-php8.3-apache
    mem_limit: 384m
    depends_on:
      - db
    ports:
      - "127.0.0.1:8877:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      WORDPRESS_CONFIG_EXTRA: "define('WP_ENVIRONMENT_TYPE', 'local');"
    volumes:
      - wp:/var/www/html
volumes:
  db:
  wp:
