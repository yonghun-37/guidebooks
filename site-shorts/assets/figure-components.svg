<svg xmlns="http://www.w3.org/2000/svg">
  <!-- 학습용 공통 도형. 특정 서비스의 화면 배치를 재현하지 않는다. -->
  <symbol id="screen-frame" viewBox="0 0 300 240">
    <rect x="2" y="2" width="296" height="236" rx="12" fill="var(--surface)" stroke="currentColor" stroke-width="1.5"/>
    <path d="M2 35H298" stroke="currentColor" stroke-width="1.5"/>
    <circle cx="18" cy="18" r="3" fill="currentColor"/>
    <path d="M30 18H90" stroke="currentColor" stroke-width="3"/>
  </symbol>
  <symbol id="number-circle" viewBox="0 0 30 30">
    <circle cx="15" cy="15" r="14" fill="var(--fig-main)"/>
  </symbol>
  <symbol id="egg-rice" viewBox="0 0 180 320">
    <rect x="1" y="1" width="178" height="318" rx="8" fill="var(--fig-good)" stroke="var(--fig-main)" stroke-width="2"/>
    <path d="M0 105H180V320H0Z" fill="var(--warm)"/>
    <ellipse cx="85" cy="208" rx="58" ry="34" fill="var(--surface)" stroke="var(--fig-main)" stroke-width="3"/>
    <path d="M27 208Q32 267 85 267T143 208" fill="var(--surface)" stroke="var(--fig-main)" stroke-width="3"/>
    <ellipse cx="85" cy="205" rx="48" ry="25" fill="var(--surface)" stroke="var(--fig-grid)" stroke-width="2"/>
    <path d="M53 198Q44 179 61 177Q61 160 80 169Q96 156 107 176Q124 174 120 191Q137 205 114 217Q91 228 71 216Q47 218 53 198Z" fill="var(--surface)" stroke="var(--fig-main)" stroke-width="2"/>
    <circle cx="86" cy="190" r="16" fill="var(--fig-yolk)"/>
    <path d="M112 174L151 119" stroke="var(--fig-main)" stroke-width="6"/>
    <path d="M179 89L154 102L145 125Q142 136 150 136L164 119L179 118" fill="var(--warm)" stroke="currentColor" stroke-width="2"/>
    <path d="M62 229l8-3m33 11l8-3m-8-48l8-3m-46 1l6-3" stroke="var(--fig-main)" stroke-width="3"/>
  </symbol>
  <symbol id="money-card" viewBox="0 0 180 320">
    <rect x="1" y="1" width="178" height="318" rx="8" fill="var(--fig-good)" stroke="var(--fig-main)" stroke-width="2"/>
    <g stroke="var(--fig-main)" stroke-width="2">
      <rect x="14" y="85" width="59" height="68" rx="7" fill="var(--warm)"/>
      <rect x="84" y="85" width="59" height="68" rx="7" fill="var(--surface)"/>
      <rect x="14" y="167" width="59" height="68" rx="7" fill="var(--surface)"/>
      <rect x="84" y="167" width="59" height="68" rx="7" fill="var(--warm)"/>
    </g>
    <g fill="var(--fig-main)" font-family="sans-serif" font-size="15" text-anchor="middle">
      <text x="43" y="125">월세</text><text x="113" y="125">생활비</text>
      <text x="43" y="207">비상금</text><text x="113" y="207">목표</text>
    </g>
  </symbol>
</svg>
