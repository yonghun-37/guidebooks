<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
<title id="title">첫 쇼츠 업로드 순서</title><desc id="desc">완성 파일을 고르고, 설명과 표시를 정한 뒤, 검토하고 일부 공개로 재생한다. 확인 후 공개하고 주소를 적는다.</desc>
<rect width="640" height="360" rx="16" fill="#f5e9e1"/>
<g font-family="sans-serif" fill="#352631" font-size="18"><text x="28" y="38" font-size="14" fill="#9b3f29">내 파일에서 공개 주소까지 · 순서 도식</text>
<g fill="#fffefa" stroke="#d5bfb2"><rect x="28" y="68" width="174" height="100" rx="10"/><rect x="233" y="68" width="174" height="100" rx="10"/><rect x="438" y="68" width="174" height="100" rx="10"/><rect x="28" y="218" width="174" height="100" rx="10"/><rect x="233" y="218" width="174" height="100" rx="10"/><rect x="438" y="218" width="174" height="100" rx="10"/></g>
<text x="44" y="101">01 파일</text><text x="44" y="140" font-size="15">완성 MP4 선택</text><text x="249" y="101">02 내용·표시</text><text x="249" y="140" font-size="15">제목·아동용·AI</text><text x="454" y="101">03 검토</text><text x="454" y="140" font-size="15">권리·화질 확인</text><text x="44" y="251">04 일부 공개</text><text x="44" y="290" font-size="15">주소로 끝까지 재생</text><text x="249" y="251">05 공개</text><text x="249" y="290" font-size="15">설정 변경·게시</text><text x="454" y="251">06 기록</text><text x="454" y="290" font-size="15">쇼츠 분류·주소</text></g>
