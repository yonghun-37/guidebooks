<svg xmlns="http://www.w3.org/2000/svg" id="upload-flow" viewBox="0 0 300 500" role="img"><title>첫 쇼츠 업로드 순서</title><desc>완성 파일, 내용과 표시, 검토, 일부 공개 재생, 공개, 분류와 주소 기록 순서</desc><rect x="3" y="2" width="294" height="66" rx="8" fill="var(--soft, #f6e9e1)" stroke="var(--muted, #73636b)"/><g fill="currentColor" font-family="inherit"><text x="18" y="29" font-size="20" font-weight="700">01 파일</text><text x="18" y="55" font-size="18">완성 MP4 선택</text></g><path d="M150 68v13m-5 -5 5 5 5 -5" fill="none" stroke="currentColor" stroke-width="2"/><rect x="3" y="87" width="294" height="66" rx="8" fill="var(--soft, #f6e9e1)" stroke="var(--muted, #73636b)"/><g fill="currentColor" font-family="inherit"><text x="18" y="114" font-size="20" font-weight="700">02 내용·표시</text><text x="18" y="140" font-size="18">제목·아동용·AI</text></g><path d="M150 153v13m-5 -5 5 5 5 -5" fill="none" stroke="currentColor" stroke-width="2"/><rect x="3" y="172" width="294" height="66" rx="8" fill="var(--soft, #f6e9e1)" stroke="var(--muted, #73636b)"/><g fill="currentColor" font-family="inherit"><text x="18" y="199" font-size="20" font-weight="700">03 검토</text><text x="18" y="225" font-size="18">권리·화질 확인</text></g><path d="M150 238v13m-5 -5 5 5 5 -5" fill="none" stroke="currentColor" stroke-width="2"/><rect x="3" y="257" width="294" height="66" rx="8" fill="var(--soft, #f6e9e1)" stroke="var(--muted, #73636b)"/><g fill="currentColor" font-family="inherit"><text x="18" y="284" font-size="20" font-weight="700">04 일부 공개</text><text x="18" y="310" font-size="18">주소로 끝까지 재생</text></g><path d="M150 323v13m-5 -5 5 5 5 -5" fill="none" stroke="currentColor" stroke-width="2"/><rect x="3" y="342" width="294" height="66" rx="8" fill="var(--soft, #f6e9e1)" stroke="var(--muted, #73636b)"/><g fill="currentColor" font-family="inherit"><text x="18" y="369" font-size="20" font-weight="700">05 공개</text><text x="18" y="395" font-size="18">설정 변경·게시</text></g><path d="M150 408v13m-5 -5 5 5 5 -5" fill="none" stroke="currentColor" stroke-width="2"/><rect x="3" y="427" width="294" height="66" rx="8" fill="var(--soft, #f6e9e1)" stroke="var(--muted, #73636b)"/><g fill="currentColor" font-family="inherit"><text x="18" y="454" font-size="20" font-weight="700">06 기록</text><text x="18" y="480" font-size="18">쇼츠 분류·주소</text></g></svg>
