<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1100 680" role="img" aria-labelledby="title desc"><title id="title">폴더와 설정의 연결</title><desc id="desc">설정에는 선택·상한을, .env에는 비밀을, private에는 실행 상태를 둡니다. 카드·렌더·업로드 코드는 기존 키트에서 복사해 독립 실행 Actions는 암호화된 외부 상태와 미완료 lease를 사용합니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#70d6bd"/></marker></defs><rect width="1100" height="680" rx="18" fill="#111d29"/><g font-family="system-ui,sans-serif" fill="#edf5fa"><text x="40" y="55" font-size="30" font-weight="700">폴더와 설정의 연결</text><text x="40" y="90" font-size="17" fill="#b1c1d0">설정에는 선택·상한을, .env에는 비밀을, private에는 실행 상태를 둡니다.</text><path d="M180 260 L180 370" fill="none" stroke="#70d6bd" stroke-width="3" marker-end="url(#arrow)"/><text x="184.0" y="307.0" font-size="15" fill="#b1c1d0"></text><path d="M550 260 L550 370" fill="none" stroke="#70d6bd" stroke-width="3" marker-end="url(#arrow)"/><text x="554.0" y="307.0" font-size="15" fill="#b1c1d0"></text><path d="M690 200 L770 200" fill="none" stroke="#70d6bd" stroke-width="3" marker-end="url(#arrow)"/><text x="734.0" y="192.0" font-size="15" fill="#b1c1d0">견적</text><path d="M690 440 L770 440" fill="none" stroke="#70d6bd" stroke-width="3" marker-end="url(#arrow)"/><text x="734.0" y="432.0" font-size="15" fill="#b1c1d0">미디어만</text><a xlink:href="../../README.md"><rect x="40" y="140" width="280" height="120" rx="15" fill="#22384b" stroke="#70d6bd" stroke-width="2"/><text x="58" y="172" font-size="18" font-weight="700">config.json</text><text x="58" y="201" font-size="17">mode / providers / models</text><text x="58" y="226" font-size="17">budget / gates / hosting</text></a><a xlink:href="../../README.md"><rect x="410" y="140" width="280" height="120" rx="15" fill="#22384b" stroke="#70d6bd" stroke-width="2"/><text x="428" y="172" font-size="18" font-weight="700">.env + private 인증</text><text x="428" y="201" font-size="17">API 키·사용자 토큰</text><text x="428" y="226" font-size="17">Git/공개 URL에 넣지 않기</text></a><a xlink:href="../../README.md"><rect x="780" y="140" width="280" height="120" rx="15" fill="#22384b" stroke="#70d6bd" stroke-width="2"/><text x="798" y="172" font-size="18" font-weight="700">providers/prices.json</text><text x="798" y="201" font-size="17">2026-10-26 조사 단가</text><text x="798" y="226" font-size="17">모델·단가·근거 분리</text></a><a xlink:href="../../README.md"><rect x="40" y="380" width="280" height="120" rx="15" fill="#22384b" stroke="#70d6bd" stroke-width="2"/><text x="58" y="412" font-size="18" font-weight="700">private/state/실행ID/</text><text x="58" y="441" font-size="17">draft·config·미디어·승인</text><text x="58" y="466" font-size="17">컨테이너/업로드 저널</text></a><a xlink:href="../../README.md"><rect x="410" y="380" width="280" height="120" rx="15" fill="#22384b" stroke="#70d6bd" stroke-width="2"/><text x="428" y="412" font-size="18" font-weight="700">state.sqlite</text><text x="428" y="441" font-size="17">단계·예외·비용·해시</text><text x="428" y="466" font-size="17">지표와 Telegram offset</text></a><a xlink:href="../../README.md"><rect x="780" y="380" width="280" height="120" rx="15" fill="#22384b" stroke="#70d6bd" stroke-width="2"/><text x="798" y="412" font-size="18" font-weight="700">공개 미디어 호스팅</text><text x="798" y="441" font-size="17">번호가 붙은 JPEG/MP4</text><text x="798" y="466" font-size="17">설정/토큰/DB 업로드 금지</text></a><text x="40" y="575" font-size="17" fill="#b1c1d0">카드·렌더·업로드 코드는 기존 키트에서 복사해 독립 실행</text><text x="40" y="602" font-size="17" fill="#b1c1d0">Actions는 암호화된 외부 상태와 미완료 lease를 사용합니다.</text></g></svg>