<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1100 680" role="img" aria-labelledby="title desc"><title id="title">하루의 자동 실행 타임라인</title><desc id="desc">시각은 키트 운영 예입니다. OS 현지 시각, 예약 간격 15분 기본값. 처음에는 approval → 기준을 조정한 뒤 auto로 전환 지연·절전·한도 때문에 정시 실행은 보장되지 않습니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#18765d"/></marker></defs><rect width="1100" height="680" rx="18" fill="#f6f3eb"/><g font-family="system-ui,sans-serif" fill="#153b42"><text x="40" y="55" font-size="30" font-weight="700">하루의 자동 실행 타임라인</text><text x="40" y="90" font-size="17" fill="#546a74">시각은 키트 운영 예입니다. OS 현지 시각, 예약 간격 15분 기본값.</text><path d="M320 210 L400 210" fill="none" stroke="#18765d" stroke-width="3" marker-end="url(#arrow)"/><text x="364.0" y="202.0" font-size="15" fill="#546a74"></text><path d="M690 210 L770 210" fill="none" stroke="#18765d" stroke-width="3" marker-end="url(#arrow)"/><text x="734.0" y="202.0" font-size="15" fill="#546a74"></text><path d="M180 270 L180 370" fill="none" stroke="#18765d" stroke-width="3" marker-end="url(#arrow)"/><text x="184.0" y="312.0" font-size="15" fill="#546a74"></text><path d="M320 440 L400 440" fill="none" stroke="#18765d" stroke-width="3" marker-end="url(#arrow)"/><text x="364.0" y="432.0" font-size="15" fill="#546a74"></text><path d="M690 440 L770 440" fill="none" stroke="#18765d" stroke-width="3" marker-end="url(#arrow)"/><text x="734.0" y="432.0" font-size="15" fill="#546a74"></text><a xlink:href="../../README.md"><rect x="40" y="150" width="280" height="120" rx="15" fill="#ffffff" stroke="#18765d" stroke-width="2"/><text x="58" y="182" font-size="18" font-weight="700">09:17 새 콘텐츠</text><text x="58" y="211" font-size="17">주제 → 생성 → 렌더</text><text x="58" y="236" font-size="17">하루 새 실행은 1회</text></a><a xlink:href="../../README.md"><rect x="410" y="150" width="280" height="120" rx="15" fill="#ffffff" stroke="#18765d" stroke-width="2"/><text x="428" y="182" font-size="18" font-weight="700">09:17 품질 관문</text><text x="428" y="211" font-size="17">통과 → 모드별 진행</text><text x="428" y="236" font-size="17">실패 → 이유와 알림</text></a><a xlink:href="../../README.md"><rect x="780" y="150" width="280" height="120" rx="15" fill="#ffffff" stroke="#18765d" stroke-width="2"/><text x="798" y="182" font-size="18" font-weight="700">공개 전 2시간</text><text x="798" y="211" font-size="17">사후 확인 기본값</text><text x="798" y="236" font-size="17">거부 시 예약 취소</text></a><a xlink:href="../../README.md"><rect x="40" y="380" width="280" height="120" rx="15" fill="#ffffff" stroke="#18765d" stroke-width="2"/><text x="58" y="412" font-size="18" font-weight="700">15분마다 tick</text><text x="58" y="441" font-size="17">실패/연기 단계 재개</text><text x="58" y="466" font-size="17">승인 대기는 바로 종료</text></a><a xlink:href="../../README.md"><rect x="410" y="380" width="280" height="120" rx="15" fill="#ffffff" stroke="#18765d" stroke-width="2"/><text x="428" y="412" font-size="18" font-weight="700">다음 날 지표 재조회</text><text x="428" y="441" font-size="17">최근 게시물 기본 7일</text><text x="428" y="466" font-size="17">미준비와 0 구분</text></a><a xlink:href="../../README.md"><rect x="780" y="380" width="280" height="120" rx="15" fill="#ffffff" stroke="#18765d" stroke-width="2"/><text x="798" y="412" font-size="18" font-weight="700">일일 운영 보고</text><text x="798" y="441" font-size="17">비용·예외·실행 이력</text><text x="798" y="466" font-size="17">대시보드·알림</text></a><text x="40" y="575" font-size="17" fill="#546a74">처음에는 approval → 기준을 조정한 뒤 auto로 전환</text><text x="40" y="602" font-size="17" fill="#546a74">지연·절전·한도 때문에 정시 실행은 보장되지 않습니다.</text></g></svg>