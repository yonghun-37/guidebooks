<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1100 680" role="img" aria-labelledby="title desc"><title id="title">실행 상태와 재시작</title><desc id="desc">완료한 단계는 건너뛰고 실패 단계부터 이어갑니다. auto는 통과 즉시 게시 · Instagram 사후 확인은 로컬 발행 대기 게시 저널·업로드 세션·중복 해시는 재시작 뒤에도 유지합니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#18765d"/></marker></defs><rect width="1100" height="680" rx="18" fill="#f6f3eb"/><g font-family="system-ui,sans-serif" fill="#153b42"><text x="40" y="55" font-size="30" font-weight="700">실행 상태와 재시작</text><text x="40" y="90" font-size="17" fill="#546a74">완료한 단계는 건너뛰고 실패 단계부터 이어갑니다.</text><path d="M320 200 L400 200" fill="none" stroke="#18765d" stroke-width="3" marker-end="url(#arrow)"/><text x="364.0" y="192.0" font-size="15" fill="#546a74">승인제</text><path d="M690 200 L770 200" fill="none" stroke="#18765d" stroke-width="3" marker-end="url(#arrow)"/><text x="734.0" y="192.0" font-size="15" fill="#546a74">승인</text><path d="M180 260 L180 370" fill="none" stroke="#18765d" stroke-width="3" marker-end="url(#arrow)"/><text x="184.0" y="307.0" font-size="15" fill="#546a74">실패/한도</text><path d="M550 260 L550 370" fill="none" stroke="#18765d" stroke-width="3" marker-end="url(#arrow)"/><text x="554.0" y="307.0" font-size="15" fill="#546a74">변경/거부</text><path d="M920 260 L920 370" fill="none" stroke="#18765d" stroke-width="3" marker-end="url(#arrow)"/><text x="924.0" y="307.0" font-size="15" fill="#546a74">유실/예약</text><a xlink:href="../../README.md"><rect x="40" y="140" width="280" height="120" rx="15" fill="#ffffff" stroke="#18765d" stroke-width="2"/><text x="58" y="172" font-size="18" font-weight="700">running</text><text x="58" y="201" font-size="17">topic → budget → draft</text><text x="58" y="226" font-size="17">render → host → gates</text></a><a xlink:href="../../README.md"><rect x="410" y="140" width="280" height="120" rx="15" fill="#ffffff" stroke="#18765d" stroke-width="2"/><text x="428" y="172" font-size="18" font-weight="700">waiting_approval</text><text x="428" y="201" font-size="17">approve ID</text><text x="428" y="226" font-size="17">파일/대상/예약을 해시 결합</text></a><a xlink:href="../../README.md"><rect x="780" y="140" width="280" height="120" rx="15" fill="#ffffff" stroke="#18765d" stroke-width="2"/><text x="798" y="172" font-size="18" font-weight="700">done / dry_run</text><text x="798" y="201" font-size="17">발행 ID / 요청 계획 저장</text><text x="798" y="226" font-size="17">insights → 성과 반영</text></a><a xlink:href="../../README.md"><rect x="40" y="380" width="280" height="120" rx="15" fill="#ffffff" stroke="#18765d" stroke-width="2"/><text x="58" y="412" font-size="18" font-weight="700">failed / deferred</text><text x="58" y="441" font-size="17">실패: 같은 ID resume</text><text x="58" y="466" font-size="17">한도: 시각이 되면 tick</text></a><a xlink:href="../../README.md"><rect x="410" y="380" width="280" height="120" rx="15" fill="#ffffff" stroke="#18765d" stroke-width="2"/><text x="428" y="412" font-size="18" font-weight="700">exception / rejected</text><text x="428" y="441" font-size="17">관문 이유 확인 후 새 실행</text><text x="428" y="466" font-size="17">거부한 실행은 발행 안 함</text></a><a xlink:href="../../README.md"><rect x="780" y="380" width="280" height="120" rx="15" fill="#ffffff" stroke="#18765d" stroke-width="2"/><text x="798" y="412" font-size="18" font-weight="700">uncertain / scheduled</text><text x="798" y="441" font-size="17">불명: 조회·수동 ID 대조</text><text x="798" y="466" font-size="17">예약: 공개 전 거부 가능</text></a><text x="40" y="575" font-size="17" fill="#546a74">auto는 통과 즉시 게시 · Instagram 사후 확인은 로컬 발행 대기</text><text x="40" y="602" font-size="17" fill="#546a74">게시 저널·업로드 세션·중복 해시는 재시작 뒤에도 유지합니다.</text></g></svg>