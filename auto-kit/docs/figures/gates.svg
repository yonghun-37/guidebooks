<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1100 680" role="img" aria-labelledby="title desc"><title id="title">품질 관문 판정</title><desc id="desc">자동 관문은 검사 가능한 신호를 찾습니다. 사실·권리 전체 보장은 아닙니다. 유사도 0.82, 음량 -19~-13 LUFS: 키트 기본값(바꿀 수 있음) 이름 누락·문맥 오류는 놓칠 수 있습니다. 선택 LLM 대조도 별도 비용입니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#18765d"/></marker></defs><rect width="1100" height="680" rx="18" fill="#f6f3eb"/><g font-family="system-ui,sans-serif" fill="#153b42"><text x="40" y="55" font-size="30" font-weight="700">품질 관문 판정</text><text x="40" y="90" font-size="17" fill="#546a74">자동 관문은 검사 가능한 신호를 찾습니다. 사실·권리 전체 보장은 아닙니다.</text><path d="M320 200 L400 200" fill="none" stroke="#18765d" stroke-width="3" marker-end="url(#arrow)"/><text x="364.0" y="192.0" font-size="15" fill="#546a74"></text><path d="M690 200 L770 200" fill="none" stroke="#18765d" stroke-width="3" marker-end="url(#arrow)"/><text x="734.0" y="192.0" font-size="15" fill="#546a74"></text><path d="M180 260 L180 370" fill="none" stroke="#18765d" stroke-width="3" marker-end="url(#arrow)"/><text x="184.0" y="307.0" font-size="15" fill="#546a74">실패</text><path d="M550 260 L550 370" fill="none" stroke="#18765d" stroke-width="3" marker-end="url(#arrow)"/><text x="554.0" y="307.0" font-size="15" fill="#546a74">통과</text><path d="M920 260 L920 370" fill="none" stroke="#18765d" stroke-width="3" marker-end="url(#arrow)"/><text x="924.0" y="307.0" font-size="15" fill="#546a74">통과</text><a xlink:href="../../README.md"><rect x="40" y="140" width="280" height="120" rx="15" fill="#ffffff" stroke="#18765d" stroke-width="2"/><text x="58" y="172" font-size="18" font-weight="700">사실·정책</text><text x="58" y="201" font-size="17">확인할 3가지: 원문 대조</text><text x="58" y="226" font-size="17">지원금 99만원: 숫자 실패</text></a><a xlink:href="../../README.md"><rect x="410" y="140" width="280" height="120" rx="15" fill="#ffffff" stroke="#18765d" stroke-width="2"/><text x="428" y="172" font-size="18" font-weight="700">중복·반복</text><text x="428" y="201" font-size="17">문자 n-gram Jaccard</text><text x="428" y="226" font-size="17">최근 게시물과 비교</text></a><a xlink:href="../../README.md"><rect x="780" y="140" width="280" height="120" rx="15" fill="#ffffff" stroke="#18765d" stroke-width="2"/><text x="798" y="172" font-size="18" font-weight="700">규격·AI·비용</text><text x="798" y="201" font-size="17">ffprobe/ffmpeg·LUFS</text><text x="798" y="226" font-size="17">Boolean 표시·비용 상한</text></a><a xlink:href="../../README.md"><rect x="40" y="380" width="280" height="120" rx="15" fill="#ffffff" stroke="#18765d" stroke-width="2"/><text x="58" y="412" font-size="18" font-weight="700">한 항목이라도 실패</text><text x="58" y="441" font-size="17">exception + 이유 저장</text><text x="58" y="466" font-size="17">로컬·메신저 미리보기</text></a><a xlink:href="../../README.md"><rect x="410" y="380" width="280" height="120" rx="15" fill="#ffffff" stroke="#18765d" stroke-width="2"/><text x="428" y="412" font-size="18" font-weight="700">모든 항목 통과</text><text x="428" y="441" font-size="17">auto: 게시</text><text x="428" y="466" font-size="17">approval: 승인 대기</text></a><a xlink:href="../../README.md"><rect x="780" y="380" width="280" height="120" rx="15" fill="#ffffff" stroke="#18765d" stroke-width="2"/><text x="798" y="412" font-size="18" font-weight="700">사후 확인 모드</text><text x="798" y="441" font-size="17">미래 시각으로 예약</text><text x="798" y="466" font-size="17">거부 전 공개 여부 확인</text></a><text x="40" y="575" font-size="17" fill="#546a74">유사도 0.82, 음량 -19~-13 LUFS: 키트 기본값(바꿀 수 있음)</text><text x="40" y="602" font-size="17" fill="#546a74">이름 누락·문맥 오류는 놓칠 수 있습니다. 선택 LLM 대조도 별도 비용입니다.</text></g></svg>