<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1100 680" role="img" aria-labelledby="title desc"><title id="title">비용 상한과 게시 한도</title><desc id="desc">금액 예시는 키트 설정값이며 서비스 무료량을 보장하지 않습니다. 실제 사용량 차트와 quota 스냅샷은 private/state/dashboard.html 이미지·영상 생성 활성화 시 실행 최대비가 커집니다. 상한을 먼저 확인하세요.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#18765d"/></marker></defs><rect width="1100" height="680" rx="18" fill="#f6f3eb"/><g font-family="system-ui,sans-serif" fill="#153b42"><text x="40" y="55" font-size="30" font-weight="700">비용 상한과 게시 한도</text><text x="40" y="90" font-size="17" fill="#546a74">금액 예시는 키트 설정값이며 서비스 무료량을 보장하지 않습니다.</text><path d="M320 200 L400 200" fill="none" stroke="#18765d" stroke-width="3" marker-end="url(#arrow)"/><text x="364.0" y="192.0" font-size="15" fill="#546a74"></text><path d="M690 200 L770 200" fill="none" stroke="#18765d" stroke-width="3" marker-end="url(#arrow)"/><text x="734.0" y="192.0" font-size="15" fill="#546a74"></text><path d="M320 440 L400 440" fill="none" stroke="#18765d" stroke-width="3" marker-end="url(#arrow)"/><text x="364.0" y="432.0" font-size="15" fill="#546a74"></text><path d="M690 440 L770 440" fill="none" stroke="#18765d" stroke-width="3" marker-end="url(#arrow)"/><text x="734.0" y="432.0" font-size="15" fill="#546a74"></text><a xlink:href="../../README.md"><rect x="40" y="140" width="280" height="120" rx="15" fill="#ffffff" stroke="#18765d" stroke-width="2"/><text x="58" y="172" font-size="18" font-weight="700">일 비용 상한 $1</text><text x="58" y="201" font-size="17">실행 전체 최대비 예약</text><text x="58" y="226" font-size="17">호출마다 예약 안에서 차감</text></a><a xlink:href="../../README.md"><rect x="410" y="140" width="280" height="120" rx="15" fill="#ffffff" stroke="#18765d" stroke-width="2"/><text x="428" y="172" font-size="18" font-weight="700">월 비용 상한 $10</text><text x="428" y="201" font-size="17">재시도·불명 비용 포함</text><text x="428" y="226" font-size="17">상한 초과 전 중단·알림</text></a><a xlink:href="../../README.md"><rect x="780" y="140" width="280" height="120" rx="15" fill="#ffffff" stroke="#18765d" stroke-width="2"/><text x="798" y="172" font-size="18" font-weight="700">실제 usage 기록</text><text x="798" y="201" font-size="17">tokens / 문자 / 영상 초</text><text x="798" y="226" font-size="17">누락 시 최대 예약액 유지</text></a><a xlink:href="../../README.md"><rect x="40" y="380" width="280" height="120" rx="15" fill="#ffffff" stroke="#18765d" stroke-width="2"/><text x="58" y="412" font-size="18" font-weight="700">Instagram 계정 한도</text><text x="58" y="441" font-size="17">조회 성공: usage / total</text><text x="58" y="466" font-size="17">조회 실패: 미확인 → 연기</text></a><a xlink:href="../../README.md"><rect x="410" y="380" width="280" height="120" rx="15" fill="#ffffff" stroke="#18765d" stroke-width="2"/><text x="428" y="412" font-size="18" font-weight="700">YouTube 할당량</text><text x="428" y="441" font-size="17">Console 확인 + 로컬 cap</text><text x="428" y="466" font-size="17">403/429 제한이면 연기</text></a><a xlink:href="../../README.md"><rect x="780" y="380" width="280" height="120" rx="15" fill="#ffffff" stroke="#18765d" stroke-width="2"/><text x="798" y="412" font-size="18" font-weight="700">지출 예산 ≠ 클라우드 알림</text><text x="798" y="441" font-size="17">공급자 hard cap도 설정</text><text x="798" y="466" font-size="17">호스팅·세금·구독 별도</text></a><text x="40" y="575" font-size="17" fill="#546a74">실제 사용량 차트와 quota 스냅샷은 private/state/dashboard.html</text><text x="40" y="602" font-size="17" fill="#546a74">이미지·영상 생성 활성화 시 실행 최대비가 커집니다. 상한을 먼저 확인하세요.</text></g></svg>