<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1100 680" role="img" aria-labelledby="title desc"><title id="title">주제에서 다음 주제까지</title><desc id="desc">두 흐름은 상태·비용·관문을 공유하고 게시 API만 나눕니다. mock: 외부 호출 0 · live: 사용자 키·인증 파일 필요 비밀·DB는 private/ · 공개 버킷에는 게시용 JPEG/MP4만</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#70d6bd"/></marker></defs><rect width="1100" height="680" rx="18" fill="#111d29"/><g font-family="system-ui,sans-serif" fill="#edf5fa"><text x="40" y="55" font-size="30" font-weight="700">주제에서 다음 주제까지</text><text x="40" y="90" font-size="17" fill="#b1c1d0">두 흐름은 상태·비용·관문을 공유하고 게시 API만 나눕니다.</text><path d="M320 200 L400 200" fill="none" stroke="#70d6bd" stroke-width="3" marker-end="url(#arrow)"/><text x="364.0" y="192.0" font-size="15" fill="#b1c1d0"></text><path d="M690 200 L770 200" fill="none" stroke="#70d6bd" stroke-width="3" marker-end="url(#arrow)"/><text x="734.0" y="192.0" font-size="15" fill="#b1c1d0"></text><path d="M920 260 L920 360" fill="none" stroke="#70d6bd" stroke-width="3" marker-end="url(#arrow)"/><text x="924.0" y="302.0" font-size="15" fill="#b1c1d0"></text><path d="M780 430 L700 430" fill="none" stroke="#70d6bd" stroke-width="3" marker-end="url(#arrow)"/><text x="744.0" y="422.0" font-size="15" fill="#b1c1d0"></text><path d="M410 430 L330 430" fill="none" stroke="#70d6bd" stroke-width="3" marker-end="url(#arrow)"/><text x="374.0" y="422.0" font-size="15" fill="#b1c1d0"></text><path d="M180 370 L180 270" fill="none" stroke="#70d6bd" stroke-width="3" marker-end="url(#arrow)"/><text x="184.0" y="312.0" font-size="15" fill="#b1c1d0">다음 날</text><a xlink:href="../../README.md"><rect x="40" y="140" width="280" height="120" rx="15" fill="#22384b" stroke="#70d6bd" stroke-width="2"/><text x="58" y="172" font-size="18" font-weight="700">① 소스 + 지난 성과</text><text x="58" y="201" font-size="17">RSS / 직접 입력 원문</text><text x="58" y="226" font-size="17">주제 점수로 하나 선정</text></a><a xlink:href="../../README.md"><rect x="410" y="140" width="280" height="120" rx="15" fill="#22384b" stroke="#70d6bd" stroke-width="2"/><text x="428" y="172" font-size="18" font-weight="700">② 생성 API</text><text x="428" y="201" font-size="17">LLM JSON → 카드 문안/대본</text><text x="428" y="226" font-size="17">이미지·TTS·영상은 선택</text></a><a xlink:href="../../README.md"><rect x="780" y="140" width="280" height="120" rx="15" fill="#22384b" stroke="#70d6bd" stroke-width="2"/><text x="798" y="172" font-size="18" font-weight="700">③ 코드 렌더</text><text x="798" y="201" font-size="17">Pillow PNG/JPEG</text><text x="798" y="226" font-size="17">ffmpeg MP4·자막·음량</text></a><a xlink:href="../../README.md"><rect x="780" y="370" width="280" height="120" rx="15" fill="#22384b" stroke="#70d6bd" stroke-width="2"/><text x="798" y="402" font-size="18" font-weight="700">④ 관문 + 운영 모드</text><text x="798" y="431" font-size="17">사실·정책·유사도·규격·비용</text><text x="798" y="456" font-size="17">auto / post_review / approval</text></a><a xlink:href="../../README.md"><rect x="410" y="370" width="280" height="120" rx="15" fill="#22384b" stroke="#70d6bd" stroke-width="2"/><text x="428" y="402" font-size="18" font-weight="700">⑤ 게시 + 지표</text><text x="428" y="431" font-size="17">Instagram 공개 URL·컨테이너</text><text x="428" y="456" font-size="17">YouTube 동일 세션 재개</text></a><a xlink:href="../../README.md"><rect x="40" y="370" width="280" height="120" rx="15" fill="#22384b" stroke="#70d6bd" stroke-width="2"/><text x="58" y="402" font-size="18" font-weight="700">⑥ SQLite + 비용</text><text x="58" y="431" font-size="17">상태·파일 해시·발행 ID</text><text x="58" y="456" font-size="17">지표 재조회 → 주제 점수</text></a><text x="40" y="575" font-size="17" fill="#b1c1d0">mock: 외부 호출 0 · live: 사용자 키·인증 파일 필요</text><text x="40" y="602" font-size="17" fill="#b1c1d0">비밀·DB는 private/ · 공개 버킷에는 게시용 JPEG/MP4만</text></g></svg>