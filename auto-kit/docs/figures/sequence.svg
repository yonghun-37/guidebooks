<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1100 680" role="img" aria-labelledby="title desc"><title id="title">게시 API 호출 순서</title><desc id="desc">인증 값은 항상 가립니다. 토큰·개인 업로드 Location을 로그에 쓰지 않습니다. POST 결과 불명 → 새 게시 요청 금지 · 기존 컨테이너/세션 조회 Instagram PUBLISHED인데 ID가 없으면 reconcile로 계정의 기존 ID를 대조</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#18765d"/></marker></defs><rect width="1100" height="680" rx="18" fill="#f6f3eb"/><g font-family="system-ui,sans-serif" fill="#153b42"><text x="40" y="55" font-size="30" font-weight="700">게시 API 호출 순서</text><text x="40" y="90" font-size="17" fill="#546a74">인증 값은 항상 가립니다. 토큰·개인 업로드 Location을 로그에 쓰지 않습니다.</text><path d="M320 200 L400 200" fill="none" stroke="#18765d" stroke-width="3" marker-end="url(#arrow)"/><text x="364.0" y="192.0" font-size="15" fill="#546a74"></text><path d="M690 200 L770 200" fill="none" stroke="#18765d" stroke-width="3" marker-end="url(#arrow)"/><text x="734.0" y="192.0" font-size="15" fill="#546a74"></text><path d="M320 440 L400 440" fill="none" stroke="#18765d" stroke-width="3" marker-end="url(#arrow)"/><text x="364.0" y="432.0" font-size="15" fill="#546a74"></text><path d="M690 440 L770 440" fill="none" stroke="#18765d" stroke-width="3" marker-end="url(#arrow)"/><text x="734.0" y="432.0" font-size="15" fill="#546a74"></text><a xlink:href="../../README.md"><rect x="40" y="140" width="280" height="120" rx="15" fill="#ffffff" stroke="#18765d" stroke-width="2"/><text x="58" y="172" font-size="18" font-weight="700">Instagram ①</text><text x="58" y="201" font-size="17">계정 한도 조회</text><text x="58" y="226" font-size="17">JPEG/릴스 URL → media</text></a><a xlink:href="../../README.md"><rect x="410" y="140" width="280" height="120" rx="15" fill="#ffffff" stroke="#18765d" stroke-width="2"/><text x="428" y="172" font-size="18" font-weight="700">Instagram ②</text><text x="428" y="201" font-size="17">컨테이너 ID 저장</text><text x="428" y="226" font-size="17">status_code 반복 조회</text></a><a xlink:href="../../README.md"><rect x="780" y="140" width="280" height="120" rx="15" fill="#ffffff" stroke="#18765d" stroke-width="2"/><text x="798" y="172" font-size="18" font-weight="700">Instagram ③</text><text x="798" y="201" font-size="17">FINISHED → media_publish</text><text x="798" y="226" font-size="17">게시 ID를 즉시 저장</text></a><a xlink:href="../../README.md"><rect x="40" y="380" width="280" height="120" rx="15" fill="#ffffff" stroke="#18765d" stroke-width="2"/><text x="58" y="412" font-size="18" font-weight="700">YouTube ①</text><text x="58" y="441" font-size="17">private·AI·아동용·예약</text><text x="58" y="466" font-size="17">POST → Location 비공개 저장</text></a><a xlink:href="../../README.md"><rect x="410" y="380" width="280" height="120" rx="15" fill="#ffffff" stroke="#18765d" stroke-width="2"/><text x="428" y="412" font-size="18" font-weight="700">YouTube ②</text><text x="428" y="441" font-size="17">PUT 청크 → 308 Range</text><text x="428" y="466" font-size="17">다음 바이트부터 계속</text></a><a xlink:href="../../README.md"><rect x="780" y="380" width="280" height="120" rx="15" fill="#ffffff" stroke="#18765d" stroke-width="2"/><text x="798" y="412" font-size="18" font-weight="700">YouTube ③</text><text x="798" y="441" font-size="17">200/201 → 영상 ID 저장</text><text x="798" y="466" font-size="17">끊기면 같은 Location 조회</text></a><text x="40" y="575" font-size="17" fill="#546a74">POST 결과 불명 → 새 게시 요청 금지 · 기존 컨테이너/세션 조회</text><text x="40" y="602" font-size="17" fill="#546a74">Instagram PUBLISHED인데 ID가 없으면 reconcile로 계정의 기존 ID를 대조</text></g></svg>