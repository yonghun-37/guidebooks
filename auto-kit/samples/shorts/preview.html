<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>월급날 10분, 돈을 네 칸으로 나누기</title><style>:root{color-scheme:light dark}body{font:18px/1.7 system-ui;max-width:1000px;margin:auto;padding:20px}img,video{max-width:min(100%,350px);vertical-align:top;margin:8px}</style><h1>월급날 10분, 돈을 네 칸으로 나누기</h1><p>직접 작성한 예시 문안입니다. 월급은 들어왔는데 어디에 쓸지 막막한가요? 10분 동안 네 칸 메모를 해 봐요.
