# 예시 파일. 사용자가 검토한 뒤 본인 저장소 .github/workflows/로 복사한다.
# Repository Settings > Secrets and variables > Actions에 아래 값을 등록한다.
# KIT_CONFIG_JSON은 비밀 없는 사용자 config.json 전체. 기본 live=false.
# 외부 비공개 R2 STATE_BUCKET은 공개 미디어 버킷과 분리한다.
# 먼저 로컬에서 상태를 초기화해 암호화 push한다(README 참조).
# 복원 실패 시 실행 금지. 캐시/artifact를 영구 상태·토큰 저장소로 사용하지 않는다.
name: auto-kit example
on:
  schedule:
    - cron: '2,17,32,47 * * * *'
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [tick, approve, reject, resume, report]
        default: tick
      flow:
        type: choice
        options: [insta, shorts]
        default: insta
      run_id:
        type: string
      live:
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: auto-kit-single-state
  cancel-in-progress: false
jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Seoul
      PYTHONUNBUFFERED: '1'
      STATE_BUCKET: ${{ secrets.STATE_BUCKET }}
      STATE_ENDPOINT: ${{ secrets.STATE_ENDPOINT }}
      STATE_ACCESS_KEY_ID: ${{ secrets.STATE_ACCESS_KEY_ID }}
      STATE_SECRET_ACCESS_KEY: ${{ secrets.STATE_SECRET_ACCESS_KEY }}
      STATE_ENCRYPTION_KEY: ${{ secrets.STATE_ENCRYPTION_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
      RUNWAY_API_KEY: ${{ secrets.RUNWAY_API_KEY }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_TOKEN_ISSUED_AT: ${{ secrets.IG_TOKEN_ISSUED_AT }}
      IG_TOKEN_EXPIRES_AT: ${{ secrets.IG_TOKEN_EXPIRES_AT }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_ALLOWED_USER: ${{ secrets.TELEGRAM_ALLOWED_USER }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      PAGES_TOKEN: ${{ secrets.PAGES_TOKEN }}
      KIT_CONFIG_JSON: ${{ secrets.KIT_CONFIG_JSON }}
      KIT_ACTION: ${{ inputs.action || 'tick' }}
      KIT_FLOW: ${{ inputs.flow || 'insta' }}
      KIT_RUN_ID: ${{ inputs.run_id }}
      # 예약 실행 live는 사용자가 Variables의 AUTO_KIT_LIVE=true를 설정할 때만 유효.
      KIT_LIVE: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.live) || vars.AUTO_KIT_LIVE || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --only-binary=:all: -r auto-kit/requirements-live.txt
      - name: 비밀을 출력하지 않고 사용자 설정 저장
        shell: python
        run: |
          import os, json
          from pathlib import Path
          value = os.environ.get('KIT_CONFIG_JSON')
          if value:
              Path('auto-kit/config.json').write_text(json.dumps(json.loads(value), ensure_ascii=False), encoding='utf-8')
      - name: 외부 상태 복원 · 실패하면 새 실행 금지
        id: restore
        run: python auto-kit/ops/state_sync.py pull --live
      - name: 생성 또는 승인/거부/재개 · 대기 시 바로 종료
        run: python auto-kit/examples/actions-entry.py
      - name: 실패한 단계도 외부 상태에 보존
        if: always() && steps.restore.outcome == 'success'
        run: python auto-kit/ops/state_sync.py push --live
# STATE 보존 실패가 발생하면 다음 예약을 비활성화하고 로컬/runner 상태를 복구한다.
# Google OAuth 파일은 초기 암호화 묶음에만 넣는다. 로그/artifact/공개 브랜치에는 금지.
