name: Deploy guidebooks to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble shelf
        run: |
          mkdir -p _site
          cp -r shelf/. _site/
          cp -r site _site/reels
          cp -r site-shorts _site/shorts
          cp -r site-blog _site/blog
          mkdir -p _site/progress/samples
          cp starter-kit/samples/*.png starter-kit/samples/*.mp4 _site/progress/samples/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
