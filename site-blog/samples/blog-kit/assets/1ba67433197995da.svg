<g fill="#fff" stroke="#26745a" stroke-width="2"><rect x="20" y="18" width="320" height="46" rx="10"/><rect x="20" y="78" width="320" height="46" rx="10"/><rect x="20" y="138" width="320" height="46" rx="10"/><rect x="20" y="198" width="320" height="46" rx="10"/></g>
<g text-anchor="middle" font-family="sans-serif" font-size="17" fill="#173e30"><text x="180" y="47">공식 공고 원문 열기</text><text x="180" y="107">대상·기간·신청 화면 메모</text><text x="180" y="167">내 상황과 나란히 비교</text><text x="180" y="227">빈칸은 담당 창구에 문의</text></g>
